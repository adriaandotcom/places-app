name: Validate Places
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: places-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Privacy and offline resource guardrails
        run: python3 scripts/check_privacy.py
  apple:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the Xcode toolchain
        id: toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift package downloads
        id: packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/SourcePackages
          key: places-packages-v3-apple-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
      - name: Cache compiled code
        id: compiled
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Xcode's content-addressed compiler results, not signed archives,
          # provisioning profiles, credentials, build logs or whole DerivedData.
          path: build/ci/CompilationCache.noindex
          key: places-compiled-v2-apple-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            places-compiled-v2-apple-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Compile iPhone and embedded Watch simulator apps
        run: |
          xcodebuild -project apps/ios/Places.xcodeproj -scheme Places \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ci/DerivedData" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/ci/SourcePackages" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$GITHUB_WORKSPACE/build/ci/CompilationCache.noindex" build
      - name: Compile Mac companion
        run: |
          xcodebuild -project apps/ios/Places.xcodeproj -scheme PlacesMac \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ci/MacDerivedData" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/ci/SourcePackages" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$GITHUB_WORKSPACE/build/ci/CompilationCache.noindex" build
