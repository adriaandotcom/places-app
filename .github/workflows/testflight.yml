name: Fast internal TestFlight
on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/watch/**'
      - 'apps/shared/**'
      - 'packages/PlacesCompanion/**'
      - 'packages/PlacesCore/**'
      - 'scripts/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
# Never cancel a release halfway through an upload. New pending commits coalesce.
concurrency:
  group: places-testflight
  cancel-in-progress: false
jobs:
  upload:
    # Enable after the first internal group and signing credentials are ready.
    if: github.ref == 'refs/heads/main' && vars.PLACES_TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLACES_TEAM_ID: ${{ vars.PLACES_TEAM_ID }}
      PLACES_PROFILE_ID: ${{ vars.PLACES_PROFILE_ID }}
      PLACES_WATCH_PROFILE_ID: ${{ vars.PLACES_WATCH_PROFILE_ID }}
      PLACES_COMPLICATION_PROFILE_ID: ${{ vars.PLACES_COMPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare temporary signing credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PLACES_SIGNING_P12: ${{ secrets.PLACES_SIGNING_P12 }}
          PLACES_SIGNING_PASSWORD: ${{ secrets.PLACES_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, plistlib, secrets, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          required = ('PLACES_TEAM_ID', 'ASC_PRIVATE_KEY', 'ASC_KEY_ID', 'ASC_ISSUER_ID',
                      'PLACES_SIGNING_P12', 'PLACES_SIGNING_PASSWORD', 'PLACES_PROFILE_ID',
                      'PLACES_WATCH_PROFILE_ID', 'PLACES_COMPLICATION_PROFILE_ID')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing TestFlight configuration: ' + ', '.join(missing))
          os.umask(0o077)
          temp = Path(os.environ['RUNNER_TEMP'])
          key = temp / 'places-app-store-connect.p8'
          key.write_text(os.environ['ASC_PRIVATE_KEY'])
          (temp / 'places-signing.p12').write_bytes(base64.b64decode(os.environ['PLACES_SIGNING_P12'], validate=True))
          from scripts.testflight import validate_distribution_profile
          profile_dir = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          profile_dir.mkdir(parents=True, exist_ok=True)
          profile_values = []
          for prefix, bundle in [('PLACES', 'com.adriaan.places'), ('PLACES_WATCH', 'com.adriaan.places.watch'),
                                 ('PLACES_COMPLICATION', 'com.adriaan.places.watch.widgets')]:
              profile = temp / (prefix + '.mobileprovision')
              subprocess.run(['ruby', 'scripts/download_testflight_profile.rb', str(profile)],
                             env={**os.environ, 'ASC_KEY_PATH': str(key), 'PLACES_PROFILE_ID': os.environ[prefix + '_PROFILE_ID']}, check=True)
              decoded = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(profile)]))
              profile_id = validate_distribution_profile(decoded, os.environ['PLACES_TEAM_ID'], bundle)
              installed_profile = profile_dir / (profile_id + '.mobileprovision')
              installed_profile.write_bytes(profile.read_bytes())
              profile_values += [(prefix + '_PROFILE_UUID', profile_id), (prefix + '_PROFILE_PATH', str(installed_profile))]
          password = secrets.token_urlsafe(32)
          print('::add-mask::' + password)
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              for name, value in [('ASC_KEY_PATH', str(key)), ('ASC_KEY_ID', os.environ['ASC_KEY_ID']),
                                  ('ASC_ISSUER_ID', os.environ['ASC_ISSUER_ID']), ('PLACES_KEYCHAIN_PASSWORD', password),
                                  ] + profile_values:
                  if '\n' in value or '\r' in value:
                      raise SystemExit('Invalid credential metadata')
                  output.write(f'{name}={value}\n')
          (temp / 'places-keychain-password').write_text(password)
          PY
          places_keychain="$RUNNER_TEMP/places-testflight.keychain-db"
          places_password=$(cat "$RUNNER_TEMP/places-keychain-password")
          security create-keychain -p "$places_password" "$places_keychain"
          security set-keychain-settings -lut 1800 "$places_keychain"
          security unlock-keychain -p "$places_password" "$places_keychain"
          security import "$RUNNER_TEMP/places-signing.p12" -P "$PLACES_SIGNING_PASSWORD" -A -t cert -f pkcs12 -k "$places_keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$places_password" "$places_keychain" > /dev/null
          security list-keychains -d user -s "$places_keychain" "$HOME/Library/Keychains/login.keychain-db"
      - name: Identify the Xcode toolchain
        id: toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift package downloads
        id: packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/testflight/SourcePackages
          key: places-packages-v2-ios-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
      - name: Cache compiled code
        id: compiled
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Xcode's content-addressed compiler results, not signed archives,
          # provisioning profiles, credentials, build logs or whole DerivedData.
          path: build/testflight/CompilationCache.noindex
          key: places-compiled-v1-ios-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            places-compiled-v1-ios-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Check, archive and upload internal beta
        run: python3 scripts/testflight.py --skip-tests
      - name: Keep symbols for user-exported crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: places-symbols-${{ github.sha }}-${{ github.run_attempt }}
          # Only debug symbols: never upload archives, signing material or logs.
          path: build/testflight/Places.xcarchive/dSYMs/
          if-no-files-found: ignore
          retention-days: 90
      - name: Report measured release time
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          file = Path('build/testflight/timings.json')
          if file.exists():
              data = json.loads(file.read_text())
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
                  output.write('## Internal beta timings\n\n')
                  for phase, seconds in data['phases'].items():
                      output.write(f'- {phase}: {seconds}s\n')
                  if cache := data.get('compilationCache'):
                      output.write(f"- Compiler cache: {cache['hits']} hits, {cache['misses']} misses\n")
                  output.write(f"\nTotal: {data['totalSeconds']}s. Apple processing and installation are additional.\n")
          PY
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/places-testflight.keychain-db" || true
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ('places-app-store-connect.p8', 'places-signing.p12', 'places-keychain-password', 'PLACES.mobileprovision',
                       'PLACES_WATCH.mobileprovision', 'PLACES_COMPLICATION.mobileprovision'):
              (Path(os.environ['RUNNER_TEMP']) / name).unlink(missing_ok=True)
          for prefix in ('PLACES', 'PLACES_WATCH', 'PLACES_COMPLICATION'):
              if os.environ.get(prefix + '_PROFILE_PATH'):
                  Path(os.environ[prefix + '_PROFILE_PATH']).unlink(missing_ok=True)
          PY
